<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live Utah snowpack dashboard: SWE, water-year precipitation, and percent of average across Utah's 8 major basins from NRCS SNOTEL sites."
    />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Share cards (docs/PLAN.md task 10). og:image is generated by the
         daily pipeline (data/og-image.png) and copied to /og-image.png.
         The %VITE_*% values come from app/.env (defaults) and the deploy
         workflow (production absolute URLs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utah Snowpack" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="Utah Snowpack" />
    <meta
      property="og:description"
      content="Live SWE and water-year precipitation across Utah's 8 major basins, from NRCS SNOTEL sites."
    />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Utah Snowpack" />
    <meta
      name="twitter:description"
      content="Live SWE and water-year precipitation across Utah's 8 major basins, from NRCS SNOTEL sites."
    />
    <meta name="twitter:image" content="%VITE_OG_IMAGE%" />
    <title>Utah Snowpack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
